<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Builder — Learn to Code</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f7fa;
    color: #1f2937;
    padding: 1.25rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.35rem; margin-bottom: 0.15rem; }
  .subtitle { color: #6b7280; margin-bottom: 1rem; font-size: 0.9rem; }
</style>
</head>
<body>
  <div id="flow-builder-root"></div>

<script src="js/flow-builder.js"></script>
<script>
  const container = document.getElementById('flow-builder-root');
  const fb = new FlowBuilder(container, {
    flow: { flow: [], selectedId: null },
    expectedCode: '',
      examples: [
        { name: 'Hello World', flow: { flow: [], selectedId: null } },
        { name: 'For Loop', flow: { flow: [], selectedId: null } },
        { name: 'If-Else', flow: { flow: [], selectedId: null } },
        { name: 'While Loop', flow: { flow: [], selectedId: null } },
        { name: 'Switch', flow: { flow: [], selectedId: null } },
        { name: 'Foreach', flow: { flow: [], selectedId: null } }
      ]
  });
</script>
</body>
</html>
